# docker-compose.yml
# Connected Games Platform - Orchestrazione Multi-Container di Riferimento
# Progetto di Laboratorio PISSIR - A.A. 2025/2026 - Università del Piemonte Orientale

version: '3.8'

networks:
  backend-tier:
    name: platform-backend-tier
    driver: bridge
    internal: true # Rete completamente isolata senza accesso a internet per massima sicurezza
  edge-tier:
    name: platform-edge-tier
    driver: bridge

volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  sqlite_locale1:
    driver: local
  sqlite_locale2:
    driver: local

services:
  # ==========================================
  # 1. DATABASE LAYER (PostgreSQL)
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432" # Esposta solo sull'host di sviluppo per ispezione / debug DB
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. IDENTITY PROVIDER (Keycloak)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: adminpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "9080:8080" # Porta 9080 esposta sull'host per accedere alla console di admin e login browser
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 3. BACKEND SERVICES (Spring Boot 3.x)
  # ==========================================
  service-core:
    build:
      context: ./service-core
      dockerfile: Dockerfile
    container_name: service-core
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/platform_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/pissir-realm
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  service-gateway:
    build:
      context: ./service-gateway
      dockerfile: Dockerfile
    container_name: service-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/pissir-realm
      - SERVICE_CORE_URL=http://service-core:8082
    ports:
      - "8081:8081" # Unico punto di ingresso REST pubblico per tutti gli Edge Node locali
    networks:
      - backend-tier
      - edge-tier # Il gateway è l'unico ponte che collega l'infrastruttura locale e il backend-tier
    depends_on:
      keycloak:
        condition: service_healthy
      service-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 4. MQTT BROKERS (Mosquitto - Isolo per Locale)
  # ==========================================
  mosquitto-locale1:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-locale1
    volumes:
      - ./mosquitto/locale1/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/locale1/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/certs:/mosquitto/config/certs:ro # Certificati CA.crt, server.crt, server.key per TLS
    ports:
      - "8883:8883" # Porta sicura MQTTS esposta per Locale 1
    networks:
      - edge-tier
    healthcheck:
      test: ["CMD-SHELL", "timeout 2s mosquitto_sub -h localhost -p 1883 -t 'test/ping' -C 1 -E || exit 1"] # Porta in chiaro interna per il solo healthcheck locale
      interval: 5s
      timeout: 3s
      retries: 3

  mosquitto-locale2:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-locale2
    volumes:
      - ./mosquitto/locale2/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/locale2/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/certs:/mosquitto/config/certs:ro
    ports:
      - "8884:8883" # Porta sicura MQTTS esposta per Locale 2 (mappa su 8883 interna)
    networks:
      - edge-tier
    healthcheck:
      test: ["CMD-SHELL", "timeout 2s mosquitto_sub -h localhost -p 1883 -t 'test/ping' -C 1 -E || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ==========================================
  # 5. EDGE GATEWAYS (Node.js / Express)
  # ==========================================
  edge-locale1:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: edge-locale1
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOCALE_ID=BAR_BELVEDERE
      - EDGE_PUBLIC_URL=http://localhost:3001
      - CENTRAL_SERVER_URL=http://service-gateway:8081
      - KEYCLOAK_URL=http://localhost:9080/realms/pissir-realm # Raggiunto via host/browser per redirect
      - MQTT_BROKER_URL=mqtts://mosquitto-locale1:8883
      - MQTT_USER=edge-client
      - MQTT_PASSWORD=edgepassword123
    volumes:
      - sqlite_locale1:/usr/src/app/data
      - ./mosquitto/certs:/usr/src/app/certs:ro # Passaggio CA.crt per validazione SSL elegante
    ports:
      - "3001:3001"
    networks:
      - edge-tier
    depends_on:
      mosquitto-locale1:
        condition: service_healthy
      service-gateway:
        condition: service_healthy

  edge-locale2:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: edge-locale2
    environment:
      - NODE_ENV=development
      - PORT=3002
      - LOCALE_ID=SALA_GIOCHI_ROMA
      - EDGE_PUBLIC_URL=http://localhost:3002
      - CENTRAL_SERVER_URL=http://service-gateway:8081
      - KEYCLOAK_URL=http://localhost:9080/realms/pissir-realm
      - MQTT_BROKER_URL=mqtts://mosquitto-locale2:8883
      - MQTT_USER=edge-client
      - MQTT_PASSWORD=edgepassword456
    volumes:
      - sqlite_locale2:/usr/src/app/data
      - ./mosquitto/certs:/usr/src/app/certs:ro
    ports:
      - "3002:3002"
    networks:
      - edge-tier
    depends_on:
      mosquitto-locale2:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
