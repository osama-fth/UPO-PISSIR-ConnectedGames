<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utenti - Connected Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
    <style>
        .main-content { margin-left: 250px; padding: 2rem; min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('utenti')}"></div>

    <div class="main-content flex-grow-1">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold"><i class="bi bi-people text-primary"></i> Utenti Registrati</h2>
                <p class="text-muted">Elenco degli utenti registrati sulla piattaforma.</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="utentiTable">
                        <thead>
                        <tr>
                            <th>ID Utente</th>
                            <th>Username</th>
                            <th>Data Registrazione</th>
                            <th>Azioni</th>
                        </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" class="text-center py-4">Caricamento utenti in corso...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Dettaglio Utente -->
<div class="modal fade" id="utenteModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-bottom">
                <h5 class="modal-title"><i class="bi bi-person-vcard text-info"></i> Statistiche Utente: <span id="modalUsername" class="text-white fw-bold"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row text-center g-3 mb-4">
                    <div class="col-md-3">
                        <div class="p-3 rounded border" style="background: var(--bg-secondary); border-color: var(--border-color) !important;">
                            <h6 class="text-muted mb-1">Partite Giocate</h6>
                            <h3 id="modalPartite" class="mb-0 fw-bold text-white">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 rounded border" style="background: var(--bg-secondary); border-color: var(--border-color) !important;">
                            <h6 class="text-muted mb-1">Vittorie</h6>
                            <h3 id="modalVinte" class="mb-0 fw-bold text-success">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 rounded border" style="background: var(--bg-secondary); border-color: var(--border-color) !important;">
                            <h6 class="text-muted mb-1">% Vittorie</h6>
                            <h3 id="modalPerc" class="mb-0 fw-bold text-info">0%</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 rounded border" style="background: var(--bg-secondary); border-color: var(--border-color) !important;">
                            <h6 class="text-muted mb-1">Tornei</h6>
                            <h3 id="modalTornei" class="mb-0 fw-bold text-warning">0</h3>
                        </div>
                    </div>
                </div>
                <div id="modalError" class="alert alert-danger d-none"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const token = "[[${jwtToken}]]";
        fetch('/api/v1/utenti', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("#utentiTable tbody");
                tbody.innerHTML = "";
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nessun utente trovato.</td></tr>';
                    return;
                }
                data.forEach(u => {
                    const tr = document.createElement("tr");
                    const date = u.dataRegistrazione ? new Date(u.dataRegistrazione).toLocaleString() : 'N/A';
                    tr.innerHTML = `
                        <td><small class="text-muted">${u.id}</small></td>
                        <td class="fw-bold">${u.username}</td>
                        <td>${date}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="showStats('${u.id}', '${u.username}')">
                                <i class="bi bi-bar-chart"></i> Statistiche
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                document.querySelector("#utentiTable tbody").innerHTML = '<tr><td colspan="4" class="text-center text-danger">Errore nel caricamento degli utenti.</td></tr>';
            });
    });

    const utenteModal = new bootstrap.Modal(document.getElementById('utenteModal'));
    window.showStats = (id, username) => {
        document.getElementById('modalUsername').textContent = username;
        document.getElementById('modalPartite').textContent = "...";
        document.getElementById('modalVinte').textContent = "...";
        document.getElementById('modalPerc').textContent = "...";
        document.getElementById('modalTornei').textContent = "...";
        document.getElementById('modalError').classList.add('d-none');
        
        utenteModal.show();

        const token = "[[${jwtToken}]]";
        fetch(`/api/v1/statistiche/utenti/${id}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('modalPartite').textContent = data.partiteGiocate;
                document.getElementById('modalVinte').textContent = data.partiteVinte;
                document.getElementById('modalPerc').textContent = data.percentualeVittorie + "%";
                document.getElementById('modalTornei').textContent = data.torneiPartecipati;
            })
            .catch(err => {
                document.getElementById('modalError').classList.remove('d-none');
                document.getElementById('modalError').textContent = "Impossibile caricare le statistiche.";
            });
    };
</script>
</body>
</html>
