<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Games - Dashboard Globale</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
    <style>
        .main-content { margin-left: 250px; padding: 2rem; min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <!-- Main Content -->
    <div class="main-content flex-grow-1">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold"><i class="bi bi-graph-up-arrow text-primary"></i> Dashboard Globale Statistiche</h2>
                <p class="text-muted">Visione d'insieme sull'utilizzo della piattaforma.</p>
            </div>
        </div>

        <!-- Contatori principali -->
        <div class="row g-4 mb-5">
            <div class="col-md-6 col-lg-3">
                <div class="card card-stat border-0 shadow-sm text-white bg-gradient-primary h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-4">
                        <i class="bi bi-joystick fs-1 mb-2 text-info"></i>
                        <h5 class="card-title fw-normal">Partite Giocate</h5>
                        <h2 class="display-5 fw-bold mb-0" th:text="${stats.totalePartiteGiocate}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card card-stat border-0 shadow-sm text-white bg-gradient-success h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-4">
                        <i class="bi bi-people fs-1 mb-2 text-success"></i>
                        <h5 class="card-title fw-normal">Giocatori Attivi</h5>
                        <h2 class="display-5 fw-bold mb-0" th:text="${stats.totaleGiocatoriAttivi}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabelle Classifiche -->
        <div class="row g-4">
            <!-- Locali Piu Attivi -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header pt-4 pb-2">
                        <h5 class="card-title fw-bold"><i class="bi bi-shop text-warning"></i> Locali Più Attivi</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Nome Locale</th>
                                    <th class="text-end">Partite Giocate</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="locale, iterStat : ${stats.localiPiuAttivi}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td><strong th:text="${locale.nomeLocale}">Nome</strong> <br> <small class="text-muted" th:text="${locale.localeId}">ID</small></td>
                                    <td class="text-end"><span class="badge bg-primary rounded-pill px-3 py-2" th:text="${locale.partiteGiocate}">0</span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(stats.localiPiuAttivi)}">
                                    <td colspan="3" class="text-center text-muted py-3">Nessun dato disponibile</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Giochi Piu Utilizzati -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header pt-4 pb-2">
                        <h5 class="card-title fw-bold"><i class="bi bi-controller text-danger"></i> Giochi Più Utilizzati</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Tipo Gioco</th>
                                    <th class="text-end">Partite Giocate</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="gioco, iterStat : ${stats.giochiPiuUtilizzati}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td class="fw-bold text-capitalize" th:text="${#strings.toLowerCase(gioco.giocoTipo)}">Gioco</td>
                                    <td class="text-end"><span class="badge bg-success rounded-pill px-3 py-2" th:text="${gioco.partiteGiocate}">0</span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(stats.giochiPiuUtilizzati)}">
                                    <td colspan="3" class="text-center text-muted py-3">Nessun dato disponibile</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
