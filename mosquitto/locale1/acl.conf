# Regole di accesso MQTT per Locale 1 (BAR_BELVEDERE): simulator scrive, edge-client legge.
# Topic strutturati: locale/{LOCALE_ID}/{giocoId}/{tipoEvento}
# Wildcard +/+ copre tutti i giochi (calciobalilla, freccette, biliardo) e tutti i tipi di evento.

user simulator
topic write locale/BAR_BELVEDERE/+/+

user edge-client
topic read locale/BAR_BELVEDERE/+/+
