# ============================================================
# mosquitto.conf — Broker MQTT per Locale 2 (SALA_GIOCHI_ROMA)
# Connected Games Platform (PISSIR A.A. 2025/2026)
# ============================================================
# TLS abilitato: certificati self-signed generati durante la
# build dell'immagine Docker (zero-config).
# ============================================================
# Porta MQTTS sicura (con TLS abilitato)
listener 8883

# Configurazioni TLS (generate a runtime in /mosquitto/data, Fix C2)
certfile /mosquitto/data/server.crt
keyfile /mosquitto/data/server.key

# Disabilita accesso anonimo: ogni client deve autenticarsi
allow_anonymous false

# File delle password (generato a runtime dall'entrypoint.sh)
password_file /mosquitto/data/password_file

# File ACL (versionato, nessun segreto)
acl_file /mosquitto/config/acl-locale2.conf

# Logging (solo informazioni rilevanti, es. PUBLISH, niente spam per auth fallite)
log_dest stdout
log_type information
log_type error
connection_messages false
