# ============================================================
# mosquitto.conf — Broker MQTT per Locale 1 (BAR_BELVEDERE)
# Connected Games Platform (PISSIR A.A. 2025/2026)
# ============================================================
# Nessun TLS: scelta esplicita documentata nelle specifiche
# per contenere la complessità di un prototipo universitario.
# Il perimetro di rete Docker isolato mitiga il rischio.
# ============================================================

# Porta in chiaro (nessun TLS per scelta progettuale dichiarata)
listener 1883

# Disabilita accesso anonimo: ogni client deve autenticarsi
allow_anonymous false

# File delle password (generato a runtime dall'entrypoint.sh)
password_file /mosquitto/data/password_file

# File ACL (versionato, nessun segreto)
acl_file /mosquitto/config/acl-locale1.conf

# Logging
log_dest stdout
log_type all
connection_messages true
