# docker-compose.yml
# Connected Games Platform - Orchestrazione Multi-Container
# Progetto di Laboratorio PISSIR - A.A. 2025/2026 - Università del Piemonte Orientale

networks:
  backend-tier:
    name: platform-backend-tier
    driver: bridge
    internal: true # Rete completamente isolata senza accesso a internet per massima sicurezza
  edge-tier:
    name: platform-edge-tier
    driver: bridge

volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  edge-locale1-data:
    driver: local
  edge-locale2-data:
    driver: local

services:
  # ==========================================
  # 1. DATABASE LAYER (PostgreSQL)
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    networks:
      - backend-tier
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d platform_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. IDENTITY PROVIDER (Keycloak)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "9080:8080" # Porta 9080 esposta sull'host per accedere alla console di admin e login browser
    networks:
      - backend-tier
      - edge-tier # Keycloak deve essere raggiungibile anche dagli Edge per l'auth OIDC
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # 3. BACKEND SERVICES (Spring Boot 3.x)
  # ==========================================
  partita-service:
    build:
      context: ./partita-service
      dockerfile: Dockerfile
    container_name: partita-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/platform_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/pissir-realm
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  torneo-service:
    build:
      context: ./torneo-service
      dockerfile: Dockerfile
    container_name: torneo-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/platform_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/pissir-realm
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  service-gateway:
    build:
      context: ./service-gateway
      dockerfile: Dockerfile
    container_name: service-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/pissir-realm
      - PARTITA_SERVICE_URL=http://partita-service:8082
      - TORNEO_SERVICE_URL=http://torneo-service:8083
    networks:
      - backend-tier
      - edge-tier # Il gateway è l'unico ponte che collega l'infrastruttura locale e il backend-tier
    depends_on:
      keycloak:
        condition: service_healthy
      partita-service:
        condition: service_healthy
      torneo-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 4. MQTT BROKERS (Mosquitto - Isolati per Locale)
  # ==========================================
  # Nessun TLS: scelta esplicita documentata nelle specifiche per
  # contenere la complessità del prototipo. Perimetro Docker isolato.
  mosquitto-locale1:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    image: connectedgames-mosquitto
    container_name: mosquitto-locale1
    environment:
      - LOCALE_ID=locale1
      - MQTT_PUB_USER=${MQTT1_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT1_PUBLISH_PASSWORD}
      - MQTT_SUB_USER=${MQTT1_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT1_SUBSCRIBE_PASSWORD}

    networks:
      - edge-tier
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t 'test/ping' -C 1 -W 2 || exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mosquitto-locale2:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    image: connectedgames-mosquitto
    container_name: mosquitto-locale2
    environment:
      - LOCALE_ID=locale2
      - MQTT_PUB_USER=${MQTT2_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT2_PUBLISH_PASSWORD}
      - MQTT_SUB_USER=${MQTT2_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT2_SUBSCRIBE_PASSWORD}

    networks:
      - edge-tier
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t 'test/ping' -C 1 -W 2 || exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # 5. EDGE GATEWAYS (Node.js / Express)
  # ==========================================
  edge-locale1:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: connectedgames-edge
    container_name: edge-locale1
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOCALE_ID=BAR_BELVEDERE
      - EDGE_PUBLIC_URL=http://localhost:3001
      - CENTRAL_SERVER_URL=http://service-gateway:8081
      # URL pubblica di Keycloak (browser dell'utente la raggiunge via localhost)
      - KEYCLOAK_URL=http://localhost:9080/realms/pissir-realm
      # URL interna di Keycloak (comunicazione backend-to-backend dentro Docker)
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/pissir-realm
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      # MQTT: porta in chiaro, no TLS
      - MQTT_BROKER_URL=mqtt://mosquitto-locale1:1883
      - MQTT_SUB_USER=${MQTT1_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT1_SUBSCRIBE_PASSWORD}
      - MQTT_PUB_USER=${MQTT1_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT1_PUBLISH_PASSWORD}
    volumes:
      - edge-locale1-data:/usr/src/app/data
    ports:
      - "3001:3001"
    networks:
      - edge-tier
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mosquitto-locale1:
        condition: service_healthy
      service-gateway:
        condition: service_healthy

  edge-locale2:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: connectedgames-edge
    container_name: edge-locale2
    environment:
      - NODE_ENV=development
      - PORT=3002
      - LOCALE_ID=SALA_GIOCHI_ROMA
      - EDGE_PUBLIC_URL=http://localhost:3002
      - CENTRAL_SERVER_URL=http://service-gateway:8081
      - KEYCLOAK_URL=http://localhost:9080/realms/pissir-realm
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/pissir-realm
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - MQTT_BROKER_URL=mqtt://mosquitto-locale2:1883
      - MQTT_SUB_USER=${MQTT2_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT2_SUBSCRIBE_PASSWORD}
      - MQTT_PUB_USER=${MQTT2_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT2_PUBLISH_PASSWORD}
    volumes:
      - edge-locale2-data:/usr/src/app/data
    ports:
      - "3002:3002"
    networks:
      - edge-tier
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mosquitto-locale2:
        condition: service_healthy
      service-gateway:
        condition: service_healthy

  # ==========================================
  # 6. STATISTICHE SERVICE (Kiosk Super Admin)
  # ==========================================
  statistiche-service:
    build:
      context: ./statistiche-service
      dockerfile: Dockerfile
    container_name: statistiche-service
    environment:
      - DASHBOARD_URL=http://localhost:3000
      - KEYCLOAK_URL=http://localhost:9080/realms/pissir-realm
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/pissir-realm
      - CLIENT_ID=platform-client
      - SESSION_SECRET=segreto_super_sicuro_dashboard
      - CENTRAL_SERVER_URL=http://service-gateway:8081
    ports:
      - "3000:3000"
    networks:
      - edge-tier
    depends_on:
      keycloak:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
