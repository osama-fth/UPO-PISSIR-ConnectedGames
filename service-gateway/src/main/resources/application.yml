# Configurazione Spring Cloud Gateway: routing reattivo dei microservizi e verifica dei token JWT Keycloak.

server:
  port: 8081

spring:
  application:
    name: service-gateway

  cloud:
    gateway:
      routes:
        # Sincronizzazione massiva partite (Bulk Sync)
        - id: partite-sincronizza
          uri: ${PARTITA_SERVICE_URL:http://partita-service:8082}
          predicates:
            - Path=/api/v1/locali/{localeId}/partite/sincronizza
            - Method=POST
          filters:
            - TenantVerification
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                methods: POST

        # Lista giochi installati in un locale
        - id: locali-giochi
          uri: ${PARTITA_SERVICE_URL:http://partita-service:8082}
          predicates:
            - Path=/api/v1/locali/{localeId}/giochi
            - Method=GET

        # Partite, Locali e Utenti (UI API)
        - id: partita-service-api
          uri: ${PARTITA_SERVICE_URL:http://partita-service:8082}
          predicates:
            - Path=/api/v1/utenti, /api/v1/utenti/**, /api/v1/locali, /api/v1/locali/**, /api/v1/partite, /api/v1/partite/**

        # Gestione Tornei
        - id: tornei-service-routes
          uri: ${TORNEO_SERVICE_URL:http://torneo-service:8083}
          predicates:
            - Path=/api/v1/tornei, /api/v1/tornei/**

        # Statistiche globali (Dashboard Admin API)
        - id: statistiche-globali-api
          uri: ${STATISTICHE_SERVICE_URL:http://statistiche-service:8084}
          predicates:
            - Path=/api/v1/statistiche/**

        # Statistiche UI
        - id: statistiche-ui
          uri: ${STATISTICHE_SERVICE_URL:http://statistiche-service:8084}
          predicates:
            - Path=/, /dashboard, /utenti, /partite, /tornei, /servizi, /auth/**, /css/**, /js/**, /images/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "http://localhost:3001, http://localhost:3002, http://localhost:8081"
            allowedMethods: "GET, POST, PUT, DELETE, OPTIONS"
            allowedHeaders: "*"
            allowCredentials: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9080/realms/pissir-realm}
          jwk-set-uri: http://keycloak:8080/realms/pissir-realm/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    com.connectedgames.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /docs
    url: /openapi-spec.yaml
