# Orchestrazione multi-container della Connected Games Platform (Postgres, Keycloak, Microservizi Spring, Edge Node Express e Mosquitto MQTTS).

networks:
  backend-tier:
    name: platform-backend-tier
    driver: bridge
    internal: true
  locale1-tier:
    name: platform-locale1-tier
    driver: bridge
  locale2-tier:
    name: platform-locale2-tier
    driver: bridge

volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  edge-locale1-data:
    driver: local
  edge-locale2-data:
    driver: local

services:
  # 1. DATABASE
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./postgres/DDL.sql:/docker-entrypoint-initdb.d/02-DDL.sql:ro
      - ./postgres/DML.sql:/docker-entrypoint-initdb.d/03-DML.sql:ro
    networks:
      - backend-tier
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d platform_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. IDENTITY PROVIDER
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak_db
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:9080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "9080:8080"
    networks:
      - backend-tier
      - locale1-tier
      - locale2-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. BACKEND SERVICES
  partita-service:
    build:
      context: ./partita-service
      dockerfile: Dockerfile
    container_name: partita-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/platform_db
      - SPRING_DATASOURCE_USERNAME=${PLATFORM_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PLATFORM_DB_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${JWT_JWK_SET_URI}
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  torneo-service:
    build:
      context: ./torneo-service
      dockerfile: Dockerfile
    container_name: torneo-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/platform_db
      - SPRING_DATASOURCE_USERNAME=${PLATFORM_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PLATFORM_DB_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${JWT_JWK_SET_URI}
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  service-gateway:
    build:
      context: ./service-gateway
      dockerfile: Dockerfile
    container_name: service-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${JWT_JWK_SET_URI}
      - PARTITA_SERVICE_URL=http://partita-service:8082
      - TORNEO_SERVICE_URL=http://torneo-service:8083
    networks:
      - backend-tier
      - locale1-tier
      - locale2-tier
    depends_on:
      keycloak:
        condition: service_healthy
      partita-service:
        condition: service_healthy
      torneo-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  statistiche-service:
    build:
      context: ./statistiche-service
      dockerfile: Dockerfile
    image: connectedgames-statistiche-service
    container_name: statistiche-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/platform_db
      - SPRING_DATASOURCE_USERNAME=${PLATFORM_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PLATFORM_DB_PASSWORD}
      - KEYCLOAK_URL=http://localhost:9080/realms/Connected-Games
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/Connected-Games
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${JWT_JWK_SET_URI}
      - GATEWAY_URL=http://localhost:8081
      - KEYCLOAK_DB_USER=${KEYCLOAK_DB_USER}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    networks:
      - backend-tier
    depends_on:
      postgres-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. MQTT BROKERS 
  mosquitto-locale1:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    image: connectedgames-mosquitto
    container_name: mosquitto-locale1
    restart: unless-stopped
    environment:
      - LOCALE_ID=locale1
      - MQTT_PUB_USER=${MQTT1_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT1_PUBLISH_PASSWORD}
      - MQTT_SUB_USER=${MQTT1_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT1_SUBSCRIBE_PASSWORD}
    networks:
      - locale1-tier
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/config/server.crt -t 'test/ping' -C 1 -W 2 || exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mosquitto-locale2:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    image: connectedgames-mosquitto
    container_name: mosquitto-locale2
    restart: unless-stopped
    environment:
      - LOCALE_ID=locale2
      - MQTT_PUB_USER=${MQTT2_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT2_PUBLISH_PASSWORD}
      - MQTT_SUB_USER=${MQTT2_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT2_SUBSCRIBE_PASSWORD}
    networks:
      - locale2-tier
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/config/server.crt -t 'test/ping' -C 1 -W 2 || exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 5. EDGE GATEWAYS
  edge-locale1:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: connectedgames-edge
    container_name: edge-locale1
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - TZ=Europe/Rome
      - PORT=3001
      - LOCALE_ID=BAR_BELVEDERE
      - EDGE_PUBLIC_URL=http://localhost:${EDGE1_HOST_PORT}
      - CENTRAL_SERVER_URL=http://service-gateway:8081
      - KEYCLOAK_URL=http://localhost:9080/realms/Connected-Games
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/Connected-Games
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - MQTT_BROKER_URL=mqtts://mosquitto-locale1:8883
      - MQTT_SUB_USER=${MQTT1_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT1_SUBSCRIBE_PASSWORD}
      - MQTT_PUB_USER=${MQTT1_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT1_PUBLISH_PASSWORD}
      - SYNC_CLIENT_ID=${SYNC_CLIENT_ID}
      - SYNC_CLIENT_SECRET=${SYNC_CLIENT_SECRET}
    volumes:
      - edge-locale1-data:/usr/src/app/data
    ports:
      - "${EDGE1_HOST_PORT}:3001"
    networks:
      - locale1-tier
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mosquitto-locale1:
        condition: service_healthy

  edge-locale2:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: connectedgames-edge
    container_name: edge-locale2
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - TZ=Europe/Rome
      - PORT=3002
      - LOCALE_ID=SALA_GIOCHI_ROMA
      - EDGE_PUBLIC_URL=http://localhost:${EDGE2_HOST_PORT}
      - CENTRAL_SERVER_URL=http://service-gateway:8081
      - KEYCLOAK_URL=http://localhost:9080/realms/Connected-Games
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/Connected-Games
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - MQTT_BROKER_URL=mqtts://mosquitto-locale2:8883
      - MQTT_SUB_USER=${MQTT2_SUBSCRIBE_USER}
      - MQTT_SUB_PASSWORD=${MQTT2_SUBSCRIBE_PASSWORD}
      - MQTT_PUB_USER=${MQTT2_PUBLISH_USER}
      - MQTT_PUB_PASSWORD=${MQTT2_PUBLISH_PASSWORD}
      - SYNC_CLIENT_ID=${SYNC_CLIENT_ID}
      - SYNC_CLIENT_SECRET=${SYNC_CLIENT_SECRET}
    volumes:
      - edge-locale2-data:/usr/src/app/data
    ports:
      - "${EDGE2_HOST_PORT}:3002"
    networks:
      - locale2-tier
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mosquitto-locale2:
        condition: service_healthy
