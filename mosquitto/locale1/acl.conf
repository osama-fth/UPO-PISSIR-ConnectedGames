# ============================================================
# acl.conf — Regole di accesso MQTT per Locale 1 (BAR_BELVEDERE)
# Connected Games Platform (PISSIR A.A. 2025/2026)
# ============================================================
# Due utenti per broker (specifiche §4):
# - simulator: può solo pubblicare (simula i sensori fisici)
# - edge-client: può solo sottoscrivere (riceve eventi dall'Edge)
# La distinzione calciobalilla/freccette avviene nel payload JSON.
# ============================================================

# Utente simulatore: può solo pubblicare eventi
user simulator
topic write locale/BAR_BELVEDERE/eventi

# Utente Edge: può solo sottoscrivere agli eventi
user edge-client
topic readwrite locale/BAR_BELVEDERE/eventi
